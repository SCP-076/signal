name: Build Signal Extension (SM 1.12)

# Manual trigger only — MM / SM branches can be overridden in the run dialog
on:
  workflow_dispatch:
    inputs:
      mms-branch:
        description: 'Metamod:Source branch'
        required: false
        default: '1.12-dev'
        type: string
      sm-branch:
        description: 'SourceMod branch'
        required: false
        default: '1.12-dev'
        type: string

jobs:
  build-sdk-1-12:
    uses: ./.github/workflows/build.yml
    with:
      mms-branch: ${{ inputs.mms-branch }}
      sm-branch: ${{ inputs.sm-branch }}
      build-name: 1.12
